# ============================================================
# MAVE / escalation-policy training
# ============================================================

train:
  task: escalation_policy
  policy: mu

  algorithm: grpo

# ------------------------------------------------------------
# Alternating optimization
# ------------------------------------------------------------

alternating:
  enabled: true

  # Optimize mu while pi is frozen.
  optimize: mu
  freeze: pi

  # Paper-specified.
  interval: 1

# ------------------------------------------------------------
# Rollout group
# ------------------------------------------------------------

rollout:
  group_size: 4

  # All K rollouts start from the same planning context.
  same_context: true

  continue_to_terminal: true

  # Rollout-level advantage is assigned to all escalation
  # actions in that rollout.
  broadcast_rollout_advantage: true

# ------------------------------------------------------------
# Escalation
# ------------------------------------------------------------

escalation:
  start_level: 0
  max_level: 4

  actions:
    - STOP
    - ESCALATE

  accumulate_feedback: true

# ------------------------------------------------------------
# Downstream return
# ------------------------------------------------------------

return:
  type: discounted_downstream_return

  gamma: 0.95

  # r_k = sum_{j=t}^T gamma^(j-t) R(s_j, a_j)
  reward_definition: null

# ------------------------------------------------------------
# Cost-aware outcome
# ------------------------------------------------------------

objective:
  lambda_cost: 0.5

  # J_k = r_k - lambda * c_k
  realized_outcome: reward_minus_cost

# ------------------------------------------------------------
# Reward-cost mapping
# ------------------------------------------------------------

reward_cost_mapping:
  type: tanh

  # phi(c) = a + b * tanh[kappa * (c - tau)]

  parameters:
    - a
    - b
    - kappa
    - tau

  constraints:
    b: positive
    kappa: positive

  regularization:
    type: l2
    eta: 0.001

  fit_scope: per_rollout_group

  optimizer:
    # Implementation choice.
    type: null
    learning_rate: null
    max_steps: null

# ------------------------------------------------------------
# Marginal-value signals
# ------------------------------------------------------------

marginal_value:
  first_order:
    enabled: true
    name: D1
    expression: phi_prime

  second_order:
    enabled: true
    name: D2
    expression: phi_double_prime

# ------------------------------------------------------------
# Advantage
# ------------------------------------------------------------

advantage:
  normalize_within_group: true

  epsilon: 1.0e-8

  components:
    J:
      weight: 1.0

    D1:
      weight: 1.0

    D2:
      weight: 1.0

  # A_MAVE =
  #   J_hat
  # + beta1 * D1_hat
  # + beta2 * D2_hat

# ------------------------------------------------------------
# GRPO
# ------------------------------------------------------------

grpo:
  learning_rate: 3.0e-5

  clipping_range: 0.2

  kl:
    enabled: true
    coefficient: 0.001

# ------------------------------------------------------------
# Training
# ------------------------------------------------------------

optimization:
  epochs: 10000
  batch_size: 6

  gradient_accumulation_steps: null
  max_grad_norm: null
  warmup_steps: null
  weight_decay: null

# ------------------------------------------------------------
# Diagnostics
# ------------------------------------------------------------

diagnostics:
  log_group_costs: true
  log_group_returns: true

  log_curve_parameters: true
  log_curve_fit_loss: true

  log_d1: true
  log_d2: true
  log_advantage: true

  log_stop_level: true