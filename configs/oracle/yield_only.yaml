# ============================================================
# Yield-only feedback setting
# ============================================================

oracle:
  setting: yield_only

  max_level: 1

  hierarchy:
    L0:
      name: none
      enabled: true
      base_cost: 0.0

    L1:
      name: reaction_yield
      enabled: true

      feedback_type: evaluative

      backend:
        type: pretrained_yield_predictor
        checkpoint: null

      output:
        type: scalar
        range:
          min: 0.0
          max: 1.0

      # In the paper's global relative-cost system,
      # reaction yield is the numerical reference.
      cost:
        base: 1.0
        min: 0.8
        max: 1.2

        # IMPORTANT:
        # ±20% is NOT random noise.
        adjustment:
          type: complexity_based

          factors:
            - num_atoms
            - num_reactants
            - num_reagents

# ------------------------------------------------------------
# Query behavior
# ------------------------------------------------------------

query:
  cache_enabled: true
  reuse_without_cost: true

# ------------------------------------------------------------
# Cost semantics
# ------------------------------------------------------------

cost:
  unit: relative_dimensionless

  reference:
    feedback_type: reaction_yield
    value: 1.0

  independent_of_downstream_reward: true